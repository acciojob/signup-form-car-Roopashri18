<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form action="" method="post">
	<label for="name">Name</label>
	<input type="text" id="name" placeholder="name" required>
	<label for="email">Email</label>
	<input type="email" id="email" placeholder="email" required>
	<label for="gender_m">Gender</label>
	<input type="radio" id="gender_m" name="gender" required>Male
	<input type="radio" id="gender_f" name="gender" required>Female
	<label for="cars">Car Brands</label>
	<select id="cars" placeholder="--Please choose an option--">
		<option>BMW</option>
		<option>BMW</option>
		<option>BMW</option>
	</select>
	<label for="age">Age</label>
	<input type="number" id="age" placeholder="Age" required>
	<label for="dob">DOB</label>
	<input type="date" id="dob" required>
	<label for="tel">Phone Number</label>
	<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
	<label for="password">Password</label>
	<input type="password" id="password" placeholder="password" required >
	<label for="tos">I agree to the TOS</label>
	<input type="checkbox" id="tos" required>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
